name: Quality Gate

on:
  push:
    branches: [main, 'control-center-*', 'hardening-*', 'autonomous-*', 'v6-*']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m compileall app
      - run: python -m pytest -q --ignore=tests/e2e
      - name: JavaScript syntax
        shell: bash
        run: |
          node --check app/web/cloud.js
          node --check app/web/app.js
          node --check app/web/sw.js
          for f in app/web/modules/*.js; do node --check "$f"; done
      - name: Validate JSON
        run: python -c "import json; [json.load(open(p,encoding='utf-8')) for p in ['app/web/manifest.json','app/web/version.json','app/web/release-manifest.json']]"

  browser:
    runs-on: ubuntu-latest
    needs: unit
    env:
      PANEL_GUARD_ENABLED: '0'
      E2E_BASE_URL: http://127.0.0.1:8000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m playwright install --with-deps chromium
      - name: Start test server
        shell: bash
        run: |
          uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/myninja-uvicorn.log 2>&1 &
          echo $! > /tmp/myninja.pid
          for i in {1..30}; do
            curl -fsS http://127.0.0.1:8000/readyz && break
            sleep 1
          done
      - run: python -m pytest -q tests/e2e
      - name: Upload server log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-server-log
          path: /tmp/myninja-uvicorn.log
