name: Quality Gate
on:
  push:
    branches: [main, 'control-center-*', 'hardening-*']
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m compileall app
      - run: python -m pytest -q
      - name: JavaScript syntax
        shell: bash
        run: |
          node --check app/web/cloud.js
          node --check app/web/app.js
          node --check app/web/sw.js
          for f in app/web/modules/*.js; do node --check "$f"; done
      - name: Validate JSON
        run: python -c "import json; [json.load(open(p,encoding='utf-8')) for p in ['app/web/manifest.json','app/web/version.json']]"
